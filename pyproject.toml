[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "calibreweb"
description = "Web app for browsing, reading and downloading eBooks stored in a Calibre database."
authors = [{name = "@OzzieIsaacs", email = "Ozzie.Fernandez.Isaacs@googlemail.com"}]
maintainers = [{name = "@OzzieIsaacs"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
keywords = [
    "calibre",
    "calibre-web",
    "library",
]
requires-python = ">=3.12"
dependencies = [
    "APScheduler>=3.11.3,<4.0.0",
    "Babel>=2.18.0,<3.0.0",
    "Flask-Babel>=4.0.0,<5.0.0",
    "Flask-Principal>=0.4.0,<1.0.0",
    "Flask>=3.1.3,<4.0.0",
    "iso-639>=0.4.5,<0.5.0; python_version<'3.12'",
    "pycountry>=22.3.5,<27.0.0; python_version>='3.12'",
    "PyPDF>=6.18.0,<7.0.0",
    "prometheus-client>=0.26.0,<1.0.0",
    "pytz>=2026.3.post1",
    "requests>=2.34.2,<3.0.0",
    "SQLAlchemy>=2.0.52,<3.0.0",
    "tornado>=6.5.8,<7.0.0",
    "Wand>=0.7.2,<0.8.0",
    "unidecode>=1.4.0,<2.0.0",
    "lxml>=6.1.3,<7.0.0",
    "flask-wtf>=1.3.0,<2.0.0",
    "chardet>=7.6.0,<8.0.0",
    "netifaces-plus>=0.12.5,<0.13.0",
    "urllib3>=2.7.0,<3.0.0",
    "Flask-Limiter>=4.1.1,<5.0.0",
    "regex>=2026.9.10,<2027.0.0",
    "nh3>=0.3.7,<0.4.0",
    "python-magic>=0.4.27,<0.5.0",
    "python-magic-bin>=0.4.0,<0.5.0;sys_platform=='win32'",
    "flask-httpAuth>=4.8.1,<5.0.0",
    "cryptography>=43.0.3,<51.0.0",
    "certifi>=2026.7.22,<2027.0.0",
    "markdown2>=2.5.5,<3.0.0",
    "pdf-inspector==1.19.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/janeczku/calibre-web"
"Bug Tracker" = "https://github.com/janeczku/calibre-web/issues"
"Release Management" = "https://github.com/janeczku/calibre-web/releases"
Documentation = "https://github.com/janeczku/calibre-web/wiki"
"Source Code" = "https://github.com/janeczku/calibre-web"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.optional-dependencies]
gdrive = [
    "google-api-python-client>=2.200.0,<3.0.0",
    "gevent>=26.8.0,<27.0.0",
    "greenlet>=3.5.5,<4.0.0",
    "httplib2>=0.32.0,<1.0.0",
    "oauth2client>=4.1.3,<5.0.0",
    "uritemplate>=4.2.0,<5.0.0",
    "pyasn1-modules>=0.4.2,<1.0.0",
    "pyasn1>=0.6.4,<1.0.0",
    "PyDrive2>=1.21.3,<2.0.0",
    "PyYAML>=6.0.3,<7.0.0",
    "rsa>=4.9.1,<5.0.0",
]
gmail = [
    "google-auth-oauthlib>=1.4.1,<2.0.0",
    "google-api-python-client>=2.200.0,<3.0.0",
]
goodreads = [
    "goodreads>=0.3.2,<0.4.0",
    "python-Levenshtein>=0.27.4,<1.0.0",
]
ldap = [
    "python-ldap>=3.4.7,<4.0.0",
    "Flask-SimpleLDAP>=2.1.0,<3.0.0",
]
oauth = [
    "Flask-Dance>=7.1.0,<8.0.0",
    "SQLAlchemy-Utils>=0.42.1,<1.0.0",
]
metadata = [
    "rarfile>=4.5,<5.0.0",
    "scholarly>=1.7.11,<2.0.0",
    "markdown2>=2.5.5,<3.0.0",
    "html2text>=2025.4.15,<2026.0.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "beautifulsoup4>=4.15.0,<5.0.0",
    "faust-cchardet>=3.2.0,<4.0.0",
    "py7zr>=1.1.3,<2.0.0",
    "mutagen>=1.48.1,<2.0.0",
    "pycountry>=22.3.5,<23.0.0",
]
comics = [
    "natsort>=8.4.0,<9.0.0",
    "comicapi>=3.2.0,<4.0.0",
]
kobo = [
    "jsonschema>=4.26.0,<5.0.0",
]

dev = [
    "import-linter>=2.15,<3.0",
    "grimp>=3.17,<4.0",
]

[project.scripts]
cps = "calibreweb.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "calibreweb.cps.constants.STABLE_VERSION"}

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "cps/static",
    "cps/translations",
    "frontend",
    "graphify-out",
    "host",
    "library",
    "tmp",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports, etc.)
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear (likely bugs and design issues)
    "UP",   # pyupgrade (modern Python syntax)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    # --- Ruff v0.16 expanded defaults (see https://astral.sh/blog/ruff-v0.16.0) ---
    "C4",   # flake8-comprehensions
    "FA",   # flake8-future-annotations
    "FLY",  # flynt (f-string conversion)
    "FURB", # refurb (refactor hints; modernisations)
    "INT",  # flake8-gettext (translations module)
    "LOG",  # logging anti-patterns (LOG004 catches swallowed exceptions)
    "PGH",  # pygrep-hooks (real bug catchers)
    "PIE",  # flake8-pie (probable bugs)
    "PT",   # flake8-pytest-style
    "S",    # flake8-bandit (security)
    "T",    # flake8-print (debug leftover prints)
    "YTT",  # flake8-2020 (sys.version misuse)
]
ignore = [
    # Cosmetic / noisy / out-of-scope for this project:
    "E501",   # line length (handled by formatter)
    "B008",   # function call in default (Flask uses this pattern heavily)
    "RUF001", # ambiguous unicode character
    "RUF012", # mutable class attributes (Flask patterns)
    # Re-add legacy categories the v0.16 default-rule promotion would otherwise
    # flag with hundreds of churn findings on a mature codebase. These are
    # tracked in `.ruff-legacy-ignore.md` for future incremental work:
    "BLE001", # blind-except (legacy code intentionally catches broad)
    "DTZ",    # datetime tz-naive (would force semantic review per call site)
    "PERF",   # perf hints (mostly list-vs-set; no measured bottleneck)
    "PL",     # pylint convention/error rules
    "PTH",    # pathlib migration (large refactor, deferred)
    "RET",    # return-statement style (cosmetic)
    "TRY",    # tryceratops (exception-handling restructuring)
    "G",      # logging style (logging-f-string etc; hundreds of sites)
]

[tool.ruff.lint.per-file-ignores]
"cps/services/*" = ["E402"]
"test/*" = ["E402", "F401"]
# cps/health.py intentionally catches broad Exception in probe code.
"cps/health.py" = ["BLE001"]
# cps/logger.py IS the logging configuration module; root-logger access is intentional.
"cps/logger.py" = ["LOG015"]
# Vendored fork of requests (cw_advocate) — asserts are upstream convention.
"cps/cw_advocate/*" = ["S101", "PGH003"]
# tornado_wsgi uses upstream-style pyright: ignore comments and asserts.
"cps/tornado_wsgi.py" = ["PGH003", "S101"]
# md5 is used for cache busting, not security.
"cps/cache_buster.py" = ["S324"]
"cps/uploader.py" = ["S324"]
"cps/gdrive.py" = ["S324", "S105"]
# Hardcoded placeholder values (default password, sync token header name).
# try/except/pass for ValueError parsing — contextlib.suppress would change semantics.
"cps/constants.py" = ["S105", "SIM105"]
"cps/services/SyncToken.py" = ["S105"]
# Server binds to all interfaces by design (configurable).
# try/except pass in optional-feature paths; no logging needed at INFO level.
"cps/server.py" = ["S104", "S110", "S112", "BLE001", "S101", "S606"]
"cps.py" = ["S110"]
"cps/error_handler.py" = ["S110", "S101"]
"cps/oauth_bb.py" = ["S101"]
"cps/updater.py" = ["S101"]
"cps/tasks/thumbnail.py" = ["S101", "S310"]
"cps/services/goodreads_support.py" = ["S101", "S113", "PGH003"]
# subproc_wrapper is the subprocess wrapper itself; input validation is its job.
"cps/subproc_wrapper.py" = ["S603"]
"cps/kobo.py" = ["S110", "S112", "BLE001", "SIM105"]
"cps/admin.py" = ["S112", "BLE001"]
# Markupsafe.Markup with template HTML; review needed before changing.
"cps/api.py" = ["S704"]
"cps/editbooks.py" = ["S704"]
# dep_check.py constructs a numeric comparison from regex-parsed version operators;
# input is constrained to digits and comparison ops by the regex above.
"cps/dep_check.py" = ["S307"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# Module-level architectural boundaries (dependency contracts).
# Run via: lint-imports  (uses the .importlinter config at the repo root).
[tool.importlinter]
# The importlinter settings live in `.importlinter` at the repo root, so we
# don't need to duplicate them here. Keeping `[tool.importlinter]` empty is
# supported by recent import-linter releases.
