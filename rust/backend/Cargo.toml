[package]
name = "taratsa_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
adler2 = "2.0.1"
axum = "0.8.9"
deunicode = "1.6.2"
hex = "0.4.3"
hmac = "0.13.0"
httpdate = "1.0.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
subtle = "2.6.1"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "signal", "sync"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }
bytes = "1.12.2"
futures-util = "0.3.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
