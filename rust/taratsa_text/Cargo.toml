[package]
name = "taratsa_text"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
caseless = "0.2.2"
html-escape = "0.3.1"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
rayon = "1.12.0"
regex = "1.13.2"
rustc-hash = "2.1.3"
serde_json = "1"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
