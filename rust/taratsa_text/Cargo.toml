[package]
name = "taratsa_text"
version = "0.1.0"
edition = "2024"

[dependencies]
caseless = "0.2.2"
html-escape = "0.3.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
rayon = "1.12.0"
regex = "1.13.2"
rustc-hash = "2.1.3"
serde_json = "1"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
