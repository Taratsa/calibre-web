services:
  calibre-web-automated:
    build:
      context: .
      dockerfile: Dockerfile
    image: calibre-web:local
    container_name: calibre-web-automated
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - NETWORK_SHARE_MODE=false
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
      - ONION_LOCATION=${ONION_LOCATION:-}
      - OCR_CACHE_DIR=${OCR_CACHE_DIR:-/config/ocr-cache/results}
      - TURBOOCR_URL=${TURBOOCR_URL:-}
      - TURBOOCR_TIMEOUT_SECONDS=${TURBOOCR_TIMEOUT_SECONDS:-900}
      - TURBOOCR_IDLE_SECONDS=${TURBOOCR_IDLE_SECONDS:-120}
      - TURBOOCR_MODE=${TURBOOCR_MODE:-ocr}
      - OCR_SCAN_CRON=${OCR_SCAN_CRON:-}
      - MANTICORE_URL=http://manticore:9308
      - BOOK_SLUGS_PATH=/app/calibre-web/seed-data/book-slugs.json
      # Rust backend (rust/backend/) on 127.0.0.1:8084, next to Flask. Off by default: Caddy keeps every route on
      # Flask until the switch is made, and Flask keeps serving whatever Rust does not.
      - RUST_BACKEND_ENABLED=${RUST_BACKEND_ENABLED:-false}
      # Where taratsa_backend listens. The default keeps it on the container's loopback (unreachable from Caddy).
      # For the /download canary set RUST_BACKEND_LISTEN=0.0.0.0:8084 in .env: Caddy then reaches it over caddy_net
      # as calibre-web-automated:8084. Do NOT publish 8084 on the host (it has no authentication of its own).
      - LISTEN=${RUST_BACKEND_LISTEN:-127.0.0.1:8084}
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./data:/config
      - ./library:/calibre-library
      # seed.mjs rewrites book-slugs.json after each catalog rebuild. Mount the DIRECTORY, not the file: a
      # single-file bind mount follows the inode, so a git stash/checkout/pull (which replaces the file) strands the
      # container on a deleted copy and new books 404 on /book/<id>/ until a restart.
      - ./frontend/src/data:/app/calibre-web/seed-data:ro
    restart: unless-stopped
    networks:
      - caddy_net
      - search_net
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    healthcheck:
      # Flask is one gevent loop; under a traffic spike or a bulk import /healthz/live answers in 1-4 s and
      # occasionally past 10 s, which is slow, not dead.
      test: ["CMD-SHELL", "curl -fsS --max-time 25 http://localhost:8083/healthz/live || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 4
      start_period: 30s

  astro-frontend:
    build:
      context: ./frontend
    image: pustaka-astro:local
    container_name: pustaka-astro
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - NODE_ENV=production
      - BACKEND_URL=http://calibre-web-automated:8084
      - MANTICORE_URL=http://manticore:9308
    restart: unless-stopped
    networks:
      - caddy_net
      - search_net
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4321/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Full-text search over the OCR/EPUB text (see AGENTS.md "Full-text search"). The index is derived data: it is
  # rebuilt from data/ocr-cache by the "Rebuild Full-Text Index Now" admin button. Manticore has no authentication,
  # so it sits ONLY on the internal search_net (Flask writes, Astro reads) and publishes no port.
  manticore:
    image: manticoresearch/manticore:32.1.3
    container_name: pustaka-manticore
    environment:
      # The image default also listens on a MySQL port and a cluster range; only HTTP is used here.
      - searchd_listen=9308:http
    volumes:
      - manticore_data:/var/lib/manticore
    restart: unless-stopped
    mem_limit: 3g
    cpus: 4
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - search_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:9308/sql?mode=raw&query=show+tables' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # rebuild-watcher: REMOVED
  # Frontend rebuilds are now triggered manually via ./build-frontend.sh on host.
  # See DEPLOY.md for details.

networks:
  caddy_net:
    external: true
  # Internal: no route to the internet or to other stacks. Only Flask, Astro and Manticore join it.
  search_net:
    internal: true

volumes:
  manticore_data: