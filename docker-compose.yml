services:
  calibre-web-automated:
    image: calibre-web:local
    container_name: calibre-web-automated
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - NETWORK_SHARE_MODE=false
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
      - ONION_LOCATION=${ONION_LOCATION:-}
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./data:/config
      - ./library:/calibre-library
    restart: unless-stopped
    networks:
      - caddy_net
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # rebuild-watcher: REMOVED
  # Frontend rebuilds are now triggered manually via ./build-frontend.sh on host.
  # See DEPLOY.md for details.

networks:
  caddy_net:
    external: true